{{ define "main" }}
<main class="content page-template page-gallery">
  <article class="post page">
    <header class="post-header">
      <a id="back-to-main-page" href="{{ "/" | relLangURL }}">{{ partial "icon-svg.html" "chevron-left" }} {{ .Site.Title }}</a>
    </header>
    <h1 class="post-title">{{ .Title }}</h1>
    <section class="post-content">
      {{ .Content }}
      {{- with .RegularPages.ByDate.Reverse }}
      <ul class="albums">
        {{- range . }}{{ partial "gallery-card.html" . }}{{ end }}
      </ul>
      {{- else }}
      {{ partial "gallery-empty.html" . }}
      {{- end }}
    </section>
  </article>
</main>
{{ end }}
